<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3d2a10">
<link rel="icon" href="logomatcho.png">
<title>Mood Matcha Mango — Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(160deg,#1b4332 0%,#5a2d0e 55%,#2a1405 100%);
 font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
 padding:24px;color:#5b3210;position:relative;overflow-x:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.g1{width:340px;height:340px;background:rgba(247,179,76,.25);top:-90px;right:-90px}
.g2{width:300px;height:300px;background:rgba(143,191,111,.30);bottom:-70px;left:-70px}
.card{position:relative;z-index:1;background:linear-gradient(165deg,#fffdf8 0%,#fff8ec 55%,#fdf1dc 100%);
 border:1px solid rgba(255,255,255,.6);border-top:6px solid #7fb069;border-radius:24px;
 padding:34px 28px;max-width:560px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.view{display:none}
.view.active{display:block;animation:stepIn .45s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}}
.script-title{font-family:'Great Vibes',cursive;font-weight:400;font-size:2.7rem;line-height:1.1;
 color:#5b3210;text-align:center;margin:0 0 10px}
h1{margin:0 0 10px;font-size:1.55rem;font-family:'Fraunces',Georgia,serif;font-weight:700;color:#5b3210;line-height:1.2}
p.sub{margin:0 0 18px;color:#9a7a55;font-size:.9rem;line-height:1.6}
.po-deadline{text-align:center;font-size:.85rem;font-weight:800;color:#8a4a15;margin:0 0 16px;line-height:1.5}
.line{border:0;border-top:1px solid rgba(232,199,149,.85);margin:16px 0}
.po-info{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.po-info-right{text-align:center;flex:none}
.po-name{font-weight:800;color:#5b3210;font-size:1.05rem;margin-bottom:8px}
.po-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price-aktif{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;font-weight:700;color:#2d6a4f;line-height:1.1}
.strike{position:relative;display:inline-block;color:#b39b7d;font-weight:600;font-size:.95rem}
.strike::after{content:'';position:absolute;left:-4%;right:-4%;top:52%;height:2px;background:#a05a1f;
 opacity:.7;transform:rotate(-10deg);border-radius:2px}
.po-price-note{font-size:.75rem;font-weight:700;color:#a05a1f;margin-top:6px}
.stock-badge{display:inline-block;background:#4a2410;color:#fff;border-radius:10px;
 padding:7px 16px;font-size:.85rem;font-weight:800}
.stock-badge.habis{background:#c22f2f}
.po-note{font-size:.82rem;color:#9a7a55;margin:0 0 18px;line-height:1.55}
textarea,input{width:100%;border:1.5px solid #ecd3a8;border-radius:14px;padding:13px;font:inherit;
 background:rgba(255,253,248,.9);color:#5b3210;margin-bottom:12px}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#c4a882}
textarea:focus,input:focus{outline:none;border-color:#7fb069}
.hint{display:none;margin:-6px 0 10px;font-size:.8rem;font-weight:700;color:#c22f2f}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
button{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}
.primary{width:100%;background:linear-gradient(135deg,#f7b34c,#e2762a);color:#fff;box-shadow:0 16px 32px rgba(226,118,42,.35)}
.primary:hover{transform:translateY(-2px)}
.primary.closed{background:#d8cbb8;color:#8a7a66;box-shadow:none;cursor:not-allowed;transform:none}
.primary.soon{background:#dcead2;color:#2d6a4f;box-shadow:none;cursor:not-allowed;transform:none}
.primary:disabled{box-shadow:none;cursor:not-allowed;transform:none}
.ghost{width:100%;background:transparent;border:1.5px solid #cfe6c6;color:#3e7a4e}
.ghost:hover{border-color:#7fb069}
.slim{padding:11px;font-size:.85rem;border-radius:999px;margin-top:10px}
.mt10{margin-top:10px}.mt16{margin-top:16px}
.row{display:flex;gap:10px;margin-top:16px}
.row .ghost{margin-top:0}
.struk{background:rgba(255,253,247,.85);border:1.5px dashed #e8c795;border-radius:16px;padding:20px;
 font-size:.88rem;color:#5b3210;line-height:1.7}
.struk .kode{font-family:'Fraunces',Georgia,serif;font-size:1.25rem;font-weight:700;color:#7a3e12;
 text-align:center;letter-spacing:.04em;margin-bottom:8px}
.struk hr{border:0;border-top:1.5px dashed #e8c795;margin:10px 0}
.struk .r{display:flex;justify-content:space-between;gap:10px}
.struk .tot{font-weight:800;font-size:1rem}
.chip{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.78rem;letter-spacing:.03em}
.chip-wait{background:#fdeacd;color:#a05a1f;border:1px solid #f0cf9a;animation:chipPulse 1.8s ease-in-out infinite}
.chip-ok{background:#eaf5e4;color:#2d6a4f;border:1px solid #cfe6c6}
.chip-done{background:#dcead2;color:#1f5738;border:1px solid #bcd9b0}
.chip-hangus{background:#efe9e2;color:#8a7a66;border:1px solid #ddd2c2}
@keyframes chipPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,118,42,.35)}50%{box-shadow:0 0 0 6px rgba(226,118,42,0)}}
.aksi{margin-top:12px;font-size:.82rem;font-weight:700;color:#8a4a15;background:#fff3dd;border:1px solid #f0cf9a;border-radius:10px;padding:10px 12px;line-height:1.5}
.mode-row{display:flex;gap:10px;margin-bottom:12px}
.mode-btn{padding:10px;font-size:.82rem;border-radius:999px;margin-bottom:0}
.mode-btn.active{background:#eaf5e4;border-color:#7fb069;color:#2d6a4f}
.list-item{width:100%;margin-top:10px;background:#fff9ec;border:1.5px solid #e8c795;border-radius:12px;
 padding:12px;text-align:left;font-size:.85rem;color:#5b3210;font-weight:700}
.list-item:hover{border-color:#e2762a}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
 background:rgba(20,10,4,.66);backdrop-filter:blur(8px);z-index:50;padding:24px}
.overlay.show{display:flex}
.popup{background:linear-gradient(165deg,#fffdf8 0%,#fff8ec 60%,#fdf1dc 100%);
 border:1px solid #f0cf9a;border-radius:28px;padding:36px 28px;text-align:center;max-width:340px;width:100%;
 box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .35s ease}
.popup-emoji{width:88px;height:88px;object-fit:contain;display:block;margin:0 auto}
.popup h2{margin:14px 0 6px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.3rem;color:#5b3210}
.popup p{margin:0 0 14px;color:#9a7a55;font-size:.88rem;line-height:1.6;font-weight:600}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.receipt-note{text-align:center;font-size:.82rem;color:#9a7a55;line-height:1.5;margin-bottom:14px}
/* skeleton: pakai class sk biar gak nabrak class garis .line */
.skeleton{background:linear-gradient(90deg,#f0e6d5 25%,#f7efe3 50%,#f0e6d5 75%);
 background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;color:transparent!important}
.skeleton *{visibility:hidden}
.skeleton.sk{height:14px;margin:8px 0}
.skeleton.sk.wide{width:100%}
.skeleton.sk.medium{width:60%}
.skeleton.sk.short{width:40%}
.skeleton.box{height:40px;border-radius:12px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<main class="card" id="mainCard">

  <section class="view active" id="view-po">
    <h1 class="script-title">Pre Order</h1>
    <p class="po-deadline skeleton sk wide" id="poDeadline">&nbsp;</p>
    <hr class="line">
    <div class="po-info">
      <div class="po-info-left">
        <div class="po-name">Mood Matcho</div>
        <div class="po-price">
          <span class="price-aktif skeleton sk short" id="priceAktif">&nbsp;</span>
          <span class="strike" id="priceCoret" style="display:none"></span>
        </div>
        <div class="po-price-note skeleton sk short" id="priceNote">&nbsp;</div>
      </div>
      <div class="po-info-right">
        <div class="po-name">Stok</div>
        <span class="stock-badge skeleton box" id="stockPill2">&nbsp;</span>
      </div>
    </div>
    <hr class="line">
    <p class="po-note skeleton sk wide" id="ambilNote">&nbsp;</p>
    <input id="poNama" placeholder="Nama lengkap" autocomplete="name">
    <p class="hint" id="poNamaHint"></p>
    <input id="poHp" placeholder="Nomor HP (08xx)" inputmode="numeric">
    <p class="hint" id="poHpHint"></p>
    <input id="poJumlah" placeholder="Jumlah botol" inputmode="numeric">
    <p class="hint" id="poJumlahHint"></p>
    <textarea id="poAlamat" rows="3" placeholder="Titik temu (sekitar UNESA Ketintang) + alamat lengkap"></textarea>
    <p class="hint" id="poAlamatHint"></p>
    <textarea id="poCatatan" rows="2" placeholder="Catatan (opsional)"></textarea>
    <button type="button" class="primary closed" id="poSubmit" disabled>Konfirmasi Pesanan</button>
    <button type="button" class="ghost slim" id="trackBtn0">Cek Status Pesanan</button>
  </section>

  <section class="view" id="view-receipt">
    <h1 class="script-title">Pesanan Tercatat</h1>
    <div class="struk" id="strukBox"></div>
    <p class="receipt-note">Simpan kode di atas. Kirim bukti transfer via WhatsApp untuk lanjut ke pembayaran.</p>
    <button type="button" class="primary mt16" id="waBtn">Bayar via WhatsApp</button>
    <div class="row">
      <button type="button" class="ghost" id="copyBtn">Salin Kode</button>
      <button type="button" class="ghost" id="trackFromReceipt">Cek Status</button>
    </div>
  </section>

  <section class="view" id="view-track">
    <h1 class="script-title">Lacak Pesanan</h1>
    <p class="sub" style="text-align:center">Pakai kode PO atau nomor HP.</p>
    <div class="mode-row">
      <button type="button" class="ghost mode-btn active" id="modeKode">Pakai Kode</button>
      <button type="button" class="ghost mode-btn" id="modeHp">Pakai Nomor HP</button>
    </div>
    <input id="trackKode" placeholder="Contoh: MM-3010-SSS-01" style="text-transform:uppercase">
    <input id="trackHp" placeholder="Contoh: 081234567890" inputmode="numeric" style="display:none">
    <p class="hint" id="trackHint"></p>
    <button type="button" class="primary" id="trackBtn">Cek Status</button>
    <div id="trackList"></div>
    <div class="struk" id="trackBox" style="display:none;margin-top:16px"></div>
    <button type="button" class="ghost slim" id="trackBack">Kembali</button>
  </section>

</main>

<div class="overlay" id="overlay">
  <div class="popup">
    <img class="popup-emoji" id="popEmoji" src="https://emojicdn.elk.sh/⏳?style=apple" alt="">
    <h2 id="popTitle"></h2>
    <p id="popText"></p>
    <button type="button" class="ghost slim" onclick="document.getElementById('overlay').classList.remove('show')">Tutup</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweX6yPg9iOERBwG4y_a-u_q_uXXBpsEzrvqoeQ8UL6kxpXoicbQv31soiFRFitGD_3/exec';

  var lastStatus = null;
  var lastPO = null;
  var trackMode = 'kode';

  function $(id){ return document.getElementById(id); }
  function log(m){ console.log('[toko]', m); }
  function rupiah(n){ return 'Rp' + Number(n).toLocaleString('id-ID'); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function rapikanStr(s){
    var str = String(s == null ? '' : s);
    if (!str) return str;
    if (str.indexOf('GMT') === -1 && str.indexOf('1899') === -1) return str;
    var dm = str.match(/(\d{1,2}\s+[A-Za-z]+\s+\d{4})/);
    var datePart = dm ? dm[1] : str.split(',')[0];
    var times = [];
    var re = /(\d{1,2}:\d{2}):\d{2}/g, m;
    while ((m = re.exec(str)) !== null) times.push(m[1]);
    var out = datePart;
    if (times.length >= 2) out += ', pukul ' + times[0] + ' - ' + times[1];
    else if (times.length === 1) out += ', pukul ' + times[0];
    return out;
  }
  function shakeEl(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function hint(id, msg){ var h = $(id); h.textContent = msg; h.style.display = 'block'; }
  function hideHint(id){ $(id).style.display = 'none'; }
  function showView(v){
    document.querySelectorAll('.view').forEach(function(x){ x.classList.remove('active'); });
    $('view-' + v).classList.add('active');
    window.scrollTo(0, 0);
  }

  function fetchJson(url, ms){
    var c = new AbortController();
    var t = setTimeout(function(){ c.abort(); }, ms || 20000);
    return fetch(url, { signal: c.signal })
      .then(function(r){ clearTimeout(t); return r.json(); });
  }

  function loadStatus(){
    fetchJson(SCRIPT_URL + '?action=status')
      .then(function(st){ lastStatus = st; log('STATUS → po=' + st.po + ' stok=' + st.stok); renderAll(st); })
      .catch(function(err){
        log('STATUS GAGAL: ' + err.message);
        var d = $('poDeadline');
        d.classList.remove('skeleton','sk','wide');
        d.textContent = 'Jadwal gagal dimuat. Refresh lagi ya.';
        $('poSubmit').disabled = true;
        $('poSubmit').classList.add('closed');
      });
  }

  function showPopup(emoji, title, text){
    $('popEmoji').src = 'https://emojicdn.elk.sh/' + emoji + '?style=apple';
    $('popTitle').textContent = title;
    $('popText').textContent = text;
    $('overlay').classList.add('show');
  }

  function renderAll(st){
    /* hapus skeleton */
    document.querySelectorAll('.skeleton').forEach(function(el){ el.classList.remove('skeleton','sk','wide','medium','short','box'); });

    /* harga */
    if (st.harga_aktif) {
      $('priceAktif').textContent = rupiah(st.harga_aktif);
      if (st.harga_coret) {
        $('priceCoret').textContent = rupiah(st.harga_coret);
        $('priceCoret').style.display = 'inline-block';
        $('priceNote').textContent = 'Harga Promo!';
      } else {
        $('priceCoret').style.display = 'none';
        $('priceNote').textContent = 'Harga per botol';
      }
    } else {
      $('priceAktif').textContent = 'Rp—';
      $('priceCoret').style.display = 'none';
      $('priceNote').textContent = 'Harga segera diumumkan';
    }
    /* stok */
    var pill = $('stockPill2');
    pill.textContent = st.stok > 0 ? (st.stok + ' botol') : 'Habis';
    pill.classList.toggle('habis', st.stok <= 0);
    /* status PO */
    var submit = $('poSubmit');
    submit.classList.remove('closed', 'soon');
    if (st.po === 'OPEN') {
      submit.disabled = false;
      submit.textContent = 'Konfirmasi Pesanan';
      $('poDeadline').textContent = 'PO dibuka sampai ' + rapikanStr(st.tutup_str);
      $('ambilNote').textContent = 'Ambil: ' + rapikanStr(st.jualan_str);
    } else {
      submit.disabled = true;
      submit.classList.add('closed');
      submit.textContent = 'Pre-Order Ditutup';
      if (st.po === 'BEFORE') {
        $('poDeadline').textContent = 'PO dibuka ' + rapikanStr(st.buka_str);
        $('ambilNote').textContent = 'Pantau terus ya, kami kabari begitu dibuka.';
        showPopup('⏳', 'Pre-Order Belum Dibuka', 'PO dibuka ' + rapikanStr(st.buka_str) + '. Kami kabari begitu dibuka ya.');
      } else if (st.po === 'SOLDOUT') {
        $('poDeadline').textContent = 'Stok periode ini habis.';
        $('ambilNote').textContent = 'Sampai jumpa di jualan berikutnya.';
        showPopup('😭', 'Stok Habis', 'Periode ini sudah habis. Kami kabari begitu jualan berikutnya dibuka.');
      } else if (st.po === 'NO_SCHEDULE') {
        $('poDeadline').textContent = 'Jadwal PO segera diumumkan.';
        $('ambilNote').textContent = 'Pantau terus ya.';
        showPopup('⏳', 'Jadwal Belum Ada', 'Jadwal PO segera diumumkan. Pantau terus ya.');
      } else {
        $('poDeadline').textContent = st.pesan_tutup || 'PO periode ini sudah ditutup.';
        $('ambilNote').textContent = 'Silakan kembali saat PO dibuka.';
        showPopup('⏳', 'Pre-Order Ditutup', st.pesan_tutup || 'PO periode ini sudah ditutup. Tunggu jualan berikutnya ya.');
      }
    }
  }

  loadStatus();

  $('trackBtn0').addEventListener('click', function(){ setMode('kode'); showView('track'); });

  function konsonan(nama){
    var s = nama.toUpperCase().replace(/[^A-Z]/g, '').replace(/[AIUEO]/g, '');
    return (s + 'XXX').slice(0, 3);
  }

  function postPO(body){
    return fetch(SCRIPT_URL, { method:'POST', body:body })
      .then(function(r){ return r.json(); })
      .then(function(j){ return j; })
      .catch(function(err){
        return fetch(SCRIPT_URL, { method:'POST', body:body, mode:'no-cors' })
          .then(function(){ return new Promise(function(res){ setTimeout(res, 1800); }); })
          .then(function(){
            return fetch(SCRIPT_URL + '?action=track&kode=' + encodeURIComponent(body.get('kode')))
              .then(function(r){ return r.json(); })
              .then(function(t){
                return t.found
                  ? { status:'success', kode:t.row.kode_po, total:t.row.total }
                  : { status:'error', message:'server tidak mencatat' };
              });
          });
      });
  }

  $('poSubmit').addEventListener('click', function(){
    if (!lastStatus) { hint('poNamaHint', 'Jadwal belum termuat. Refresh.'); return; }
    var nama = $('poNama').value.trim();
    var hp = $('poHp').value.trim();
    var jumlah = parseInt($('poJumlah').value, 10);
    var alamat = $('poAlamat').value.trim();
    var ok = true;
    ['poNamaHint','poHpHint','poJumlahHint','poAlamatHint'].forEach(hideHint);
    if (!nama) { shakeEl($('poNama')); hint('poNamaHint', 'Nama wajib diisi.'); ok = false; }
    if (!/^08\d{8,11}$/.test(hp)) { shakeEl($('poHp')); hint('poHpHint', 'Nomor HP tidak valid.'); ok = false; }
    if (!jumlah || jumlah < 1) { shakeEl($('poJumlah')); hint('poJumlahHint', 'Minimal 1 botol.'); ok = false; }
    else if (jumlah > lastStatus.stok) { shakeEl($('poJumlah')); hint('poJumlahHint', 'Stok tinggal ' + lastStatus.stok + ' botol.'); ok = false; }
    if (alamat.length < 10) { shakeEl($('poAlamat')); hint('poAlamatHint', 'Titik temu + alamat selengkap mungkin.'); ok = false; }
    if (!ok) return;

    var btn = $('poSubmit');
    btn.disabled = true; btn.innerText = 'Memproses...';

    var pre = 'MM-' + (lastStatus.jualan_ddmm || '0000') + '-' + konsonan(nama);
    fetchJson(SCRIPT_URL + '?action=next_seq&pre=' + encodeURIComponent(pre))
      .then(function(res){
        var kode = pre + '-' + String(res.seq || 1).padStart(2, '0');
        var body = new URLSearchParams();
        body.append('type', 'po');
        body.append('kode', kode);
        body.append('nama', nama);
        body.append('hp', hp);
        body.append('jumlah', jumlah);
        body.append('titik_temu', alamat);
        body.append('catatan', $('poCatatan').value.trim());

        return postPO(body).then(function(reply){
          btn.disabled = false; btn.innerText = 'Konfirmasi Pesanan';
          if (reply.status !== 'success') {
            shakeEl($('poJumlah'));
            hint('poJumlahHint', 'Server: ' + reply.message);
            alert('GAGAL: ' + reply.message);
            return;
          }
          var harga = lastStatus.harga_aktif;
          lastPO = { kode: reply.kode, nama:nama, hp:hp, jumlah:jumlah, harga:harga,
                     subtotal: jumlah * harga, admin: lastStatus.admin || 0, total: reply.total, alamat:alamat,
                     jualan: lastStatus.jualan_str, wa: lastStatus.wa };
          renderStruk(lastPO);
          showView('receipt');
        });
      })
      .catch(function(err){
        btn.disabled = false; btn.innerText = 'Konfirmasi Pesanan';
        hint('poNamaHint', 'Gagal memproses: ' + err.message);
      });
  });

  function renderStruk(po){
    $('strukBox').innerHTML =
      '<div class="kode">' + esc(po.kode) + '</div><hr>' +
      '<div class="r"><span>Nama</span><span>' + esc(po.nama) + '</span></div>' +
      '<div class="r"><span>HP</span><span>' + esc(po.hp) + '</span></div>' +
      '<div class="r"><span>Jumlah</span><span>' + po.jumlah + ' botol</span></div>' +
      '<div class="r"><span>Harga</span><span>' + rupiah(po.harga) + ' x ' + po.jumlah + '</span></div>' +
      '<div class="r"><span>Subtotal</span><span>' + rupiah(po.subtotal) + '</span></div>' +
      '<div class="r"><span>Biaya admin</span><span>' + rupiah(po.admin) + '</span></div>' +
      '<div class="r tot"><span>TOTAL</span><span>' + rupiah(po.total) + '</span></div><hr>' +
      '<div class="r"><span>Ambil</span><span>' + esc(rapikanStr(po.jualan)) + '</span></div>' +
      '<div class="r"><span>Titik temu</span><span style="text-align:right">' + esc(po.alamat) + '</span></div>';
    try { localStorage.setItem('mm_last_kode', po.kode); } catch (e) {}
    var msg = 'Halo! Aku mau konfirmasi Pre-Order Mood Matcha Mango\nKode PO: ' + po.kode + '\nNama: ' + po.nama + '\nJumlah: ' + po.jumlah + ' botol\nTotal: ' + rupiah(po.total) + '\nTitik temu: ' + po.alamat;
    $('waBtn').onclick = function(){
      window.open('https://wa.me/' + po.wa + '?text=' + encodeURIComponent(msg), '_blank');
    };
  }

  $('copyBtn').addEventListener('click', function(){
    if (!lastPO) return;
    try {
      navigator.clipboard.writeText(lastPO.kode).then(function(){ alert('Kode disalin: ' + lastPO.kode); });
    } catch (e) { alert('Kode kamu: ' + lastPO.kode); }
  });
  $('trackFromReceipt').addEventListener('click', function(){
    if (!lastPO) { showView('track'); return; }
    setMode('kode');
    $('trackKode').value = lastPO.kode;
    showView('track');
    fetchTrack(lastPO.kode, 'trackBox', 'trackHint');
  });

  function labelStatus(row){
    var st = String(row.status || '').toUpperCase();
    if (st === 'HANGUS' || row.hangus) return ['HANGUS', 'chip-hangus', 'Pesanan hangus karena belum dibayar sebelum PO tutup. Silakan pesan ulang kalau PO masih buka.'];
    if (st === 'DELIVERED' || row.delivered) return ['SELESAI', 'chip-done', 'Pesanan sudah diserahkan. Terima kasih!'];
    if (st === 'PAID' || row.paid) return ['TERBAYAR', 'chip-ok', 'Pembayaran diterima. Produk diserahkan sesuai tanggal & titik temu.'];
    return ['MENUNGGU BAYAR', 'chip-wait', 'Belum kirim bukti transfer. Klik tombol WhatsApp untuk lanjut bayar sebelum PO tutup.'];
  }

  function renderTrack(row, boxId){
    var l = labelStatus(row);
    var box = $(boxId);
    box.style.display = 'block';
    var aksiBtn = '';
    if (l[1] === 'chip-wait') {
      aksiBtn = '<div class="row" style="margin-top:12px">' +
        '<button type="button" class="primary" data-wa="1">Lanjut ke WhatsApp</button>' +
        '<button type="button" class="ghost" data-copy="1">Salin Kode</button></div>';
    }
    box.innerHTML =
      '<div class="kode">' + esc(row.kode_po) + '</div>' +
      '<div style="text-align:center;margin-bottom:8px"><span class="chip ' + l[1] + '">' + l[0] + '</span></div>' +
      '<div class="r"><span>Nama</span><span>' + esc(row.nama) + '</span></div>' +
      '<div class="r"><span>Jumlah</span><span>' + row.jumlah + ' botol</span></div>' +
      '<div class="r"><span>Total</span><span>' + rupiah(row.total) + '</span></div>' +
      '<div class="r"><span>Ambil</span><span>' + esc(rapikanStr(row.tanggal_ambil)) + '</span></div>' +
      '<div class="r"><span>Titik temu</span><span style="text-align:right">' + esc(row.titik_temu || '-') + '</span></div>' +
      '<div class="aksi">' + l[2] + '</div>' + aksiBtn;
    box.querySelectorAll('[data-wa]').forEach(function(b){
      b.onclick = function(){
        var wa = (lastStatus && lastStatus.wa) || '';
        var msg = 'Halo! Konfirmasi PO Mood Matcha Mango\nKode: ' + row.kode_po + '\nNama: ' + row.nama + '\nTotal: ' + rupiah(row.total);
        window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(msg), '_blank');
      };
    });
    box.querySelectorAll('[data-copy]').forEach(function(b){
      b.onclick = function(){
        try { navigator.clipboard.writeText(row.kode_po).then(function(){ alert('Kode disalin: ' + row.kode_po); }); }
        catch (e) { alert('Kode: ' + row.kode_po); }
      };
    });
  }

  function fetchTrack(kode, boxId, hintId){
    fetchJson(SCRIPT_URL + '?action=track&kode=' + encodeURIComponent(kode))
      .then(function(res){
        if (res.found) { if (hintId) hideHint(hintId); $('trackList').innerHTML = ''; renderTrack(res.row, boxId); }
        else {
          $(boxId).style.display = 'none';
          if (hintId) hint(hintId, 'Kode tidak ditemukan.');
        }
      })
      .catch(function(){ if (hintId) hint(hintId, 'Gagal memuat.'); });
  }

  function fetchTrackHp(hp){
    fetchJson(SCRIPT_URL + '?action=track_hp&hp=' + encodeURIComponent(hp))
      .then(function(res){
        $('trackBox').style.display = 'none';
        hideHint('trackHint');
        var wrap = $('trackList');
        wrap.innerHTML = '';
        if (!res.list || !res.list.length) { hint('trackHint', 'Tidak ada pesanan untuk nomor ini.'); return; }
        res.list.forEach(function(row){
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'list-item';
          b.textContent = row.kode_po + ' • ' + row.jumlah + ' botol • ' + rupiah(row.total) + ' • ' + String(row.status);
          b.onclick = function(){ renderTrack(row, 'trackBox'); };
          wrap.appendChild(b);
        });
      })
      .catch(function(){ hint('trackHint', 'Gagal memuat.'); });
  }

  function setMode(m){
    trackMode = m;
    $('modeKode').classList.toggle('active', m === 'kode');
    $('modeHp').classList.toggle('active', m === 'hp');
    $('trackKode').style.display = (m === 'kode') ? 'block' : 'none';
    $('trackHp').style.display = (m === 'hp') ? 'block' : 'none';
    $('trackList').innerHTML = '';
    $('trackBox').style.display = 'none';
    hideHint('trackHint');
  }
  $('modeKode').addEventListener('click', function(){ setMode('kode'); });
  $('modeHp').addEventListener('click', function(){ setMode('hp'); });

  $('trackBtn').addEventListener('click', function(){
    if (trackMode === 'kode') {
      var k = $('trackKode').value.trim().toUpperCase();
      if (!k) { shakeEl($('trackKode')); hint('trackHint', 'Masukkan kode PO.'); return; }
      fetchTrack(k, 'trackBox', 'trackHint');
    } else {
      var hp = $('trackHp').value.trim();
      if (!hp) { shakeEl($('trackHp')); hint('trackHint', 'Masukkan nomor HP.'); return; }
      fetchTrackHp(hp);
    }
  });
  $('trackBack').addEventListener('click', function(){ showView('po'); loadStatus(); });
});
</script>
</body>
</html>
