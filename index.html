<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matcha Mood Meter</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(180deg,#eef9f0,#d7efe0);font-family:'Segoe UI',Arial,sans-serif;padding:24px;color:#173b2a}
  .card{background:#fff;border-radius:24px;padding:28px;max-width:520px;width:100%;
        box-shadow:0 18px 50px rgba(31,87,56,.15)}
  h1{color:#1f5738;margin:0 0 6px;font-size:1.6rem}
  p.sub{color:#42695a;margin:0 0 20px;font-size:.95rem}
  label{display:block;font-weight:700;margin:14px 0 6px;color:#204d37}
  .emoji-group{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .emoji-btn{border:2px solid #cde7d6;background:#f7fff9;border-radius:16px;padding:12px 4px;
             cursor:pointer;text-align:center;font-size:1.5rem;line-height:1.2}
  .emoji-btn small{display:block;font-size:.7rem;font-weight:700;color:#275d3d;margin-top:4px}
  .emoji-btn.selected{border-color:#3e8e5a;background:#eaf9ef;transform:translateY(-2px)}
  input,select,textarea{width:100%;box-sizing:border-box;border:2px solid #cfe6d8;border-radius:12px;
                        padding:11px;font:inherit;background:#fff}
  button{width:100%;margin-top:20px;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;
         background:linear-gradient(135deg,#3e8e5a,#1f5738);color:#fff;cursor:pointer}
  #status{display:none;margin-top:14px;text-align:center;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <h1>🍵 Matcha Mood Meter</h1>
  <p class="sub">Scan, pilih emoji, jujur aja. Satu klik kecilmu berarti banget.</p>

  <form id="reviewForm">
    <label>Ekspresi kamu setelah cobain:</label>
    <div class="emoji-group">
      <div class="emoji-btn" data-emosi="bahagia_banget">😆<small>Enak banget!</small></div>
      <div class="emoji-btn" data-emosi="bahagia">😊<small>Enak</small></div>
      <div class="emoji-btn" data-emosi="kurang">😕<small>Kurang</small></div>
      <div class="emoji-btn" data-emosi="ga_cocok">😞<small>Ga cocok</small></div>
    </div>
    <input type="hidden" name="emosi" id="emosiInput" required>

    <label for="nama">Nama (wajib):</label>
    <input id="nama" name="nama" placeholder="contoh: Dinda" required>

    <label for="produk">Produk:</label>
    <select id="produk" name="produk">
      <option>Matcha Pudding</option>
      <option>Matcha Drink</option>
    </select>

    <label for="catatan_rasa">Catatan rasa:</label>
    <select id="catatan_rasa" name="catatan_rasa">
      <option>Pas</option>
      <option>Terlalu manis</option>
      <option>Terlalu pahit</option>
      <option>Terlalu enak</option>
      <option>Kurang matcha</option>
    </select>

    <label for="ulasan">Ulasan (opsional):</label>
    <textarea id="ulasan" name="ulasan" rows="3" placeholder="Rasanya gimana?"></textarea>

    <label for="saran">Saran (opsional):</label>
    <textarea id="saran" name="saran" rows="2" placeholder="Bikin varian less sweet dong..."></textarea>

    <button type="submit" id="submitBtn">Kirim mood matcha-ku 🍵</button>
    <div id="status"></div>
  </form>
</main>

<script>
  // ⚠️ GANTI DENGAN URL /exec APPS SCRIPT LU
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzpzZzYbAmtBy8CvE_vQ5SADFP-uC_vw6-q4nnYHKaILy0F5prU7knJaGpxjRcOAoI/exec';

  document.querySelectorAll('.emoji-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.emoji-btn').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      document.getElementById('emosiInput').value = btn.dataset.emosi;
    });
  });

  document.getElementById('reviewForm').addEventListener('submit', function(e){
    e.preventDefault();
    if (!document.getElementById('emosiInput').value) {
      alert('Pilih salah satu emoji dulu ya!');
      return;
    }
    var btn = document.getElementById('submitBtn');
    var status = document.getElementById('status');
    btn.disabled = true;
    btn.innerText = 'Mengirim...';

    // TRIK KUNCI: URLSearchParams (bukan FormData) biar Google bisa baca
    var body = new URLSearchParams(new FormData(e.target));

    fetch(SCRIPT_URL, { method: 'POST', body: body, mode: 'no-cors' })
      .then(function(){
        status.style.display = 'block';
        status.style.color = '#1f5738';
        status.innerText = '✅ Makasih! Ulasanmu udah masuk.';
        e.target.reset();
        document.querySelectorAll('.emoji-btn').forEach(function(b){ b.classList.remove('selected'); });
        btn.disabled = false;
        btn.innerText = 'Kirim mood matcha-ku 🍵';
      })
      .catch(function(){
        status.style.display = 'block';
        status.style.color = '#c22f2f';
        status.innerText = '❌ Gagal mengirim, coba lagi ya.';
        btn.disabled = false;
      });
  });
</script>
</body>
</html>
