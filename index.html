<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matcha Mood Meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(165deg,#2d6a4f 0%,#1b4332 45%,#081c15 100%);
 font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;
 padding:24px;color:#1f5738;position:relative;overflow-x:hidden}
.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.g1{width:340px;height:340px;background:rgba(217,160,102,.20);top:-90px;right:-90px}
.g2{width:300px;height:300px;background:rgba(64,145,108,.35);bottom:-70px;left:-70px}
.card{position:relative;z-index:1;
 background:linear-gradient(165deg,#ffffff 0%,#f5faf2 55%,#edf6e9 100%);
 border:1px solid rgba(255,255,255,.55);border-radius:28px;
 padding:32px 26px;max-width:520px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.badge{display:inline-block;background:#eaf5e4;color:#3e7a4e;padding:6px 14px;border-radius:999px;
 font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
 border:1px solid #cfe6c6;margin-bottom:12px}
h1{margin:0 0 6px;font-size:1.6rem;font-family:'Fraunces',Georgia,serif;font-weight:600;color:#1f5738;line-height:1.2}
p.sub{margin:0 0 22px;color:#6b8f7a;font-size:.92rem;line-height:1.6}
.step{display:none}
.step.active{display:block;animation:stepIn .45s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}}
.emoji-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.emoji-btn{background:#f7fbf4;border:1.5px solid #dcead2;border-radius:24px;padding:20px 8px 16px;
 cursor:pointer;text-align:center;transition:.15s;box-shadow:0 12px 24px rgba(31,87,56,.10)}
.emoji-btn img{width:74px;height:74px;object-fit:contain;display:block;margin:0 auto 8px;
 animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(31,87,56,.18))}
.emoji-btn:nth-child(2) img{animation-delay:.4s}
.emoji-btn:nth-child(3) img{animation-delay:.8s}
.emoji-btn:nth-child(4) img{animation-delay:1.2s}
.emoji-btn small{font-size:.78rem;font-weight:800;color:#3e7a4e}
.emoji-btn:hover{transform:translateY(-3px);border-color:#7fb069}
.emoji-btn:active{transform:scale(.96)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubbles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:8px 0;transition:gap .5s}
.bubble{background:#f2f8ec;border:1.5px solid #d5e8c8;color:#2d6a4f;font:inherit;font-weight:700;
 font-size:.9rem;border-radius:999px;padding:13px 20px;cursor:pointer;white-space:nowrap;
 animation:floaty 3.4s ease-in-out infinite;box-shadow:0 8px 18px rgba(31,87,56,.08);
 transition:opacity .5s,transform .5s,width .5s,padding .5s,margin .5s,border-width .5s,background .3s}
.bubble:nth-child(2){animation-delay:.3s}.bubble:nth-child(3){animation-delay:.6s}
.bubble:nth-child(4){animation-delay:.9s}.bubble:nth-child(5){animation-delay:1.2s}
.bubble:hover{border-color:#7fb069;transform:translateY(-2px)}
.bubbles.picked{gap:0}
.bubbles.picked .bubble{animation:none}
.bubbles.picked .bubble:not(.selected){
 opacity:0;transform:scale(.4);width:0;padding:0;margin:0;border-width:0;
 overflow:hidden;pointer-events:none}
.bubbles.picked .bubble.selected{
 transform:scale(1.15);background:linear-gradient(135deg,#8fbf6f,#4e8a5a);
 color:#fff;border-color:transparent;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 16px 32px rgba(78,138,90,.35)}50%{box-shadow:0 16px 46px rgba(78,138,90,.6)}}
.yn-group{margin-bottom:18px}
.q{margin:0 0 9px;font-weight:800;color:#204d37;font-size:.95rem;line-height:1.45}
.yn{display:flex;gap:10px}
.yn-btn{flex:1;background:#f2f8ec;border:1.5px solid #d5e8c8;color:#2d6a4f;font:inherit;
 font-weight:800;font-size:.95rem;border-radius:16px;padding:13px;cursor:pointer;transition:.15s;
 box-shadow:0 8px 18px rgba(31,87,56,.08)}
.yn-btn:hover{border-color:#7fb069;transform:translateY(-2px)}
.yn-btn.selected{background:linear-gradient(135deg,#8fbf6f,#4e8a5a);color:#fff;border-color:transparent;
 transform:scale(1.04);box-shadow:0 14px 28px rgba(78,138,90,.35)}
textarea,input{width:100%;border:1.5px solid #dcead2;border-radius:16px;padding:13px;font:inherit;
 background:#fbfdf9;color:#1f5738}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:#9dbba6}
textarea:focus,input:focus{outline:none;border-color:#7fb069}
.row{display:flex;gap:10px;margin-top:16px}
button{border:0;border-radius:16px;padding:14px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}
.primary{width:100%;background:linear-gradient(135deg,#8fbf6f,#4e8a5a);color:#fff;
 box-shadow:0 16px 32px rgba(78,138,90,.30)}
.primary:hover{transform:translateY(-2px)}
.row .primary{width:auto;flex:1}
.ghost{flex:1;background:transparent;border:1.5px solid #cfe6c6;color:#4e8a5a}
.hint{display:none;margin:8px 0 0;font-size:.82rem;font-weight:700;color:#c22f2f}
#step5 .primary{margin-top:16px}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
 background:rgba(4,20,12,.66);backdrop-filter:blur(8px);z-index:50;padding:24px}
.overlay.show{display:flex}
.popup{position:relative;
 background:linear-gradient(165deg,#ffffff 0%,#f5faf2 60%,#edf6e9 100%);
 border:1px solid #cfe6c6;border-radius:28px;padding:42px 32px 36px;text-align:center;
 max-width:360px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:pop .35s ease}
.popup-emoji{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto;
 filter:drop-shadow(0 12px 22px rgba(31,87,56,.25))}
.popup h2{margin:16px 0 6px;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.5rem;color:#1f5738}
.popup p{margin:0;color:#6b8f7a;font-size:.92rem;line-height:1.55}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.spark{position:absolute;width:34px;height:34px;object-fit:contain;animation:twinkle 1.4s ease-in-out infinite}
.s1{top:26px;left:40px}
.s2{top:48px;right:42px;animation-delay:.5s}
@keyframes twinkle{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1.15);opacity:1}}
.apology{position:absolute;bottom:92px;right:36px;width:46px;height:46px;object-fit:contain;
 transform-origin:bottom center;animation:bow 1.6s ease-in-out infinite;
 filter:drop-shadow(0 8px 14px rgba(31,87,56,.25))}
@keyframes bow{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
.anim-bahagia_banget{animation:jump .7s ease-in-out infinite}
.anim-bahagia{animation:sway 1.6s ease-in-out infinite}
.anim-kurang{animation:tilt 1.8s ease-in-out infinite}
.anim-ga_cocok{animation:droop 2.2s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.06)}60%{transform:translateY(0) scale(.96)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) translateY(-3px)}70%{transform:rotate(8deg)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(6px) rotate(-4deg)}}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<main class="card">
  <span class="badge">🍵 Pudding Matcha Drink</span>
  <h1 id="stepTitle">Terima Kasih Sudah Mencoba!! Gimana Rasanya?</h1>
  <p class="sub" id="stepSub">Pilih emoji yang paling mirip ekspresi kamu setelah seruputan pertama.</p>

  <section class="step active" id="step1">
    <div class="emoji-grid">
      <button type="button" class="emoji-btn" data-emosi="bahagia_banget" data-char="😆"><img src="https://emojicdn.elk.sh/😆?style=apple" alt="Enak banget"><small>Enak banget!</small></button>
      <button type="button" class="emoji-btn" data-emosi="bahagia" data-char="😊"><img src="https://emojicdn.elk.sh/😊?style=apple" alt="Enak"><small>Enak</small></button>
      <button type="button" class="emoji-btn" data-emosi="kurang" data-char="😕"><img src="https://emojicdn.elk.sh/😕?style=apple" alt="Kurang"><small>Kurang</small></button>
      <button type="button" class="emoji-btn" data-emosi="ga_cocok" data-char="😞"><img src="https://emojicdn.elk.sh/😞?style=apple" alt="Ga cocok"><small>Ga cocok</small></button>
    </div>
  </section>

  <section class="step" id="step2">
    <div class="bubbles" id="bubbles">
      <button type="button" class="bubble" data-rasa="Pas">Pas</button>
      <button type="button" class="bubble" data-rasa="Terlalu manis">Terlalu manis</button>
      <button type="button" class="bubble" data-rasa="Terlalu pahit">Terlalu pahit</button>
      <button type="button" class="bubble" data-rasa="Terlalu enak">Terlalu enak</button>
      <button type="button" class="bubble" data-rasa="Kurang matcha">Kurang matcha</button>
    </div>
  </section>

  <section class="step" id="step3">
    <div class="yn-group">
      <p class="q">Apakah Menurut Kamu Harganya Mahal?</p>
      <div class="yn">
        <button type="button" class="yn-btn" data-q="harga" data-v="Ya">Ya</button>
        <button type="button" class="yn-btn" data-q="harga" data-v="Tidak">Tidak</button>
      </div>
    </div>
    <div class="yn-group">
      <p class="q">Apakah kamu bersedia membeli lagi?</p>
      <div class="yn">
        <button type="button" class="yn-btn" data-q="beli" data-v="Ya">Ya</button>
        <button type="button" class="yn-btn" data-q="beli" data-v="Tidak">Tidak</button>
      </div>
    </div>
  </section>

  <section class="step" id="step4">
    <textarea id="saran" rows="4" placeholder="Tulis saran atau kritik kamu di sini..."></textarea>
    <p class="hint" id="saranHint">Isi saran dulu ya, atau tekan Lewati 🙏</p>
    <div class="row">
      <button type="button" class="ghost" id="skipBtn">Lewati</button>
      <button type="button" class="primary" id="nextBtn">Lanjut</button>
    </div>
  </section>

  <section class="step" id="step5">
    <input id="nama" placeholder="Nama kamu" autocomplete="name">
    <p class="hint" id="nameHint">Isi nama dulu ya 🙏</p>
    <button type="button" class="primary" id="submitBtn">Kirim ulasan 🍵</button>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="popup">
    <img class="spark s1" alt="">
    <img class="spark s2" alt="">
    <img class="apology" alt="">
    <img class="popup-emoji" id="popupEmoji" src="https://emojicdn.elk.sh/🍵?style=apple" alt="">
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
  </div>
</div>

<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzpzZzYbAmtBy8CvE_vQ5SADFP-uC_vw6-q4nnYHKaILy0F5prU7knJaGpxjRcOAoI/exec';
  var state = { emosi:'', char:'', rasa:'', harga:'', beli:'', saran:'', nama:'' };

  var MOODS = {
    bahagia_banget: { title:'HOREEE!!', text:'Semangat kamu nular banget, makasih ya!', deco:'spark' },
    bahagia:        { title:'Hihi, syukaa!', text:'Senyum kamu jadi semangat kami hari ini', deco:'spark' },
    kurang:         { title:'Yah, maaf ya...', text:'Terima kasih udah jujur, kami akan perbaiki!', deco:'apology' },
    ga_cocok:       { title:'Hiks, maaf belum cocok...', text:'Masukan kamu berharga banget buat kami!', deco:'apology' }
  };
  var TITLES = {
    1: ['Terima Kasih Sudah Mencoba!! Gimana Rasanya?', 'Pilih emoji yang paling mirip ekspresi kamu setelah seruputan pertama.'],
    2: ['Gimana rasanya?', 'Ketuk bubble yang paling sesuai sama lidah kamu.'],
    3: ['Dua pertanyaan cepat!', 'Jawab jujur ya, ini bantu kami banget.'],
    4: ['Ada saran atau kritik?', 'Opsional — tapi kata-kata kamu emas buat kami.'],
    5: ['Masukkan Nama kamu Yaa', 'Biar kami bisa ucapin makasih secara proper.']
  };

  function goStep(n){
    document.querySelectorAll('.step').forEach(function(s){ s.classList.remove('active'); });
    document.getElementById('step'+n).classList.add('active');
    document.getElementById('stepTitle').textContent = TITLES[n][0];
    document.getElementById('stepSub').textContent = TITLES[n][1];
  }

  function shakeEl(el){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  }

  var overlayTimer = null;
  function showOverlay(char, anim, title, text, ms, onDone, deco){
    var ov = document.getElementById('overlay');
    var img = document.getElementById('popupEmoji');
    img.src = 'https://emojicdn.elk.sh/' + encodeURIComponent(char) + '?style=apple';
    img.className = 'popup-emoji ' + anim;

    var sparks = document.querySelectorAll('.spark');
    var apol = document.querySelector('.apology');
    var chars = ['✨','🌟'];
    sparks.forEach(function(s, i){
      if (deco === 'spark') {
        s.src = 'https://emojicdn.elk.sh/' + encodeURIComponent(chars[i]) + '?style=apple';
        s.style.display = 'block';
      } else { s.style.display = 'none'; }
    });
    if (deco === 'apology') {
      apol.src = 'https://emojicdn.elk.sh/' + encodeURIComponent('🙏') + '?style=apple';
      apol.style.display = 'block';
    } else { apol.style.display = 'none'; }

    document.getElementById('popupTitle').textContent = title;
    document.getElementById('popupText').textContent = text;
    ov.classList.add('show');
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(function(){ closeOverlay(onDone); }, ms);
    ov.onclick = function(){ closeOverlay(onDone); };
  }
  function closeOverlay(onDone){
    if (overlayTimer) { clearTimeout(overlayTimer); overlayTimer = null; }
    document.getElementById('overlay').classList.remove('show');
    if (onDone) onDone();
  }

  document.querySelectorAll('.emoji-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.emosi = btn.dataset.emosi;
      state.char = btn.dataset.char;
      var m = MOODS[state.emosi];
      showOverlay(state.char, 'anim-' + state.emosi, m.title, m.text, 1800,
        function(){ goStep(2); }, m.deco);
    });
  });

  document.querySelectorAll('.bubble').forEach(function(b){
    b.addEventListener('click', function(){
      var wrap = document.getElementById('bubbles');
      if (wrap.classList.contains('picked')) return;
      state.rasa = b.dataset.rasa;
      b.classList.add('selected');
      wrap.classList.add('picked');
      setTimeout(function(){ goStep(3); }, 1150);
    });
  });

  var ynTimer = null;
  document.querySelectorAll('.yn-btn').forEach(function(b){
    b.addEventListener('click', function(){
      state[b.dataset.q] = b.dataset.v;
      b.parentNode.querySelectorAll('.yn-btn').forEach(function(x){ x.classList.remove('selected'); });
      b.classList.add('selected');
      if (state.harga && state.beli && !ynTimer) {
        ynTimer = setTimeout(function(){ ynTimer = null; goStep(4); }, 800);
      }
    });
  });

  document.getElementById('skipBtn').onclick = function(){ state.saran = ''; goStep(5); };
  document.getElementById('nextBtn').onclick = function(){
    var ta = document.getElementById('saran');
    var val = ta.value.trim();
    if (!val) {
      shakeEl(ta);
      document.getElementById('saranHint').style.display = 'block';
      return;
    }
    state.saran = val;
    goStep(5);
  };

  document.getElementById('submitBtn').onclick = function(){
    var inp = document.getElementById('nama');
    var nama = inp.value.trim();
    if (!nama) {
      shakeEl(inp);
      document.getElementById('nameHint').style.display = 'block';
      return;
    }
    state.nama = nama;
    var btn = this;
    btn.disabled = true; btn.innerText = 'Mengirim...';
    var body = new URLSearchParams();
    body.append('nama', state.nama);
    body.append('emosi', state.emosi);
    body.append('catatan_rasa', state.rasa);
    body.append('harga_sesuai', state.harga);
    body.append('beli_lagi', state.beli);
    body.append('saran', state.saran);
    fetch(SCRIPT_URL, { method:'POST', body:body, mode:'no-cors' })
      .then(function(){
        btn.disabled = false; btn.innerText = 'Kirim ulasan 🍵';
        showOverlay(state.char, 'anim-' + state.emosi,
          'Makasih ya, ' + state.nama + '!',
          'Semoga harimu seenak matcha ini 🍵✨', 4200, resetAll, 'spark');
      })
      .catch(function(){
        btn.disabled = false; btn.innerText = 'Kirim ulasan 🍵';
        var h = document.getElementById('nameHint');
        h.textContent = '❌ Gagal mengirim, coba lagi.';
        h.style.display = 'block';
      });
  };

  function resetAll(){
    state = { emosi:'', char:'', rasa:'', harga:'', beli:'', saran:'', nama:'' };
    document.getElementById('saran').value = '';
    document.getElementById('nama').value = '';
    document.getElementById('saranHint').style.display = 'none';
    document.getElementById('nameHint').style.display = 'none';
    var wrap = document.getElementById('bubbles');
    wrap.classList.remove('picked');
    document.querySelectorAll('.bubble').forEach(function(b){ b.classList.remove('selected'); });
    document.querySelectorAll('.yn-btn').forEach(function(b){ b.classList.remove('selected'); });
    goStep(1);
  }
</script>
</body>
</html>
