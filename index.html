<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulasan Matcha</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0fdf4; color: #14532d; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #15803d; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #bbf7d0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #15803d; color: white; padding: 12px; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #166534; }
        .emoji-group { display: flex; gap: 10px; margin-top: 10px; }
        .emoji-btn { flex: 1; padding: 10px; border: 2px solid #bbf7d0; border-radius: 8px; background: white; cursor: pointer; text-align: center; }
        .emoji-btn.selected { background: #dcfce7; border-color: #15803d; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍵 Matcha Mood Meter</h1>
        <form id="reviewForm">
            <label>Ekspresi Kamu:</label>
            <div class="emoji-group">
                <div class="emoji-btn" onclick="selectEmoji(this, 'bahagia_banget')">😆<br>Bahagia Banget</div>
                <div class="emoji-btn" onclick="selectEmoji(this, 'bahagia')">😊<br>Bahagia</div>
                <div class="emoji-btn" onclick="selectEmoji(this, 'biasa_aja')">😕<br>Biasa Aja</div>
                <div class="emoji-btn" onclick="selectEmoji(this, 'ga_bahagia')">😞<br>Ga Bahagia</div>
            </div>
            <input type="hidden" name="emosi" id="emosiInput" required>

            <label>Nama:</label>
            <input type="text" name="nama" required>

            <label>Produk:</label>
            <select name="produk">
                <option value="Matcha Pudding">Matcha Pudding</option>
                <option value="Matcha Drink">Matcha Drink</option>
            </select>

            <label>Catatan Rasa:</label>
            <select name="catatan_rasa">
                <option value="Pas">Pas</option>
                <option value="Terlalu Manis">Terlalu Manis</option>
                <option value="Terlalu Pahit">Terlalu Pahit</option>
                <option value="Terlalu Enak">Terlalu Enak</option>
            </select>

            <label>Ulasan:</label>
            <textarea name="ulasan" rows="3"></textarea>

            <label>Saran:</label>
            <textarea name="saran" rows="2"></textarea>

            <button type="submit" id="submitBtn">Kirim Ulasan</button>
            <div id="status"></div>
        </form>
    </div>

    <script>
        // GANTI URL INI DENGAN URL APPS SCRIPT LU
        const scriptURL = 'PASTE_URL_APPS_SCRIPT_LU_DISINI'; 

        function selectEmoji(element, value) {
            document.querySelectorAll('.emoji-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('emosiInput').value = value;
        }

        const form = document.getElementById('reviewForm');
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = 'Mengirim...';
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors' })
                .then(response => {
                    statusDiv.style.display = 'block';
                    statusDiv.innerText = '✅ Makasih! Ulasanmu udah masuk.';
                    statusDiv.style.color = 'green';
                    form.reset();
                    document.querySelectorAll('.emoji-btn').forEach(btn => btn.classList.remove('selected'));
                    btn.disabled = false;
                    btn.innerText = 'Kirim Ulasan';
                })
                .catch(error => {
                    statusDiv.style.display = 'block';
                    statusDiv.innerText = '❌ Gagal mengirim. Coba lagi.';
                    statusDiv.style.color = 'red';
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
